<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>◈ INVITACIÓN CIFRADA ◈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
/* ─── RESET ─── */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
    --green: #00ff41;
    --green-dim: #00cc33;
    --green-dark: #003d0d;
    --green-glow: rgba(0, 255, 65, 0.15);
    --bg: #050805;
    --surface: rgba(0, 12, 2, 0.85);
    --border: rgba(0, 255, 65, 0.2);
    --text: #d4ffda;
    --text-dim: rgba(0, 255, 65, 0.5);
    --font-mono: 'Share Tech Mono', 'Courier New', monospace;
    --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
}

html { scroll-behavior: smooth; }

body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
}

/* ─── GRID BACKGROUND ─── */
.bg-grid {
    position: fixed;
    inset: 0;
    z-index: 0;
    background-image:
        linear-gradient(rgba(0, 255, 65, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 255, 65, 0.03) 1px, transparent 1px);
    background-size: 50px 50px;
}

/* ─── PARTICLES CANVAS ─── */
#particles {
    position: fixed;
    inset: 0;
    z-index: 1;
    opacity: 0.5;
}

/* ─── SCANLINES ─── */
.scanlines {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0, 255, 65, 0.02) 2px,
        rgba(0, 255, 65, 0.02) 4px
    );
}

/* ─── CRT GLOW OVERLAY ─── */
.crt-glow {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, 0.6) 100%);
}

/* ─── TERMINAL ─── */
.terminal {
    position: relative;
    z-index: 10;
    width: 92%;
    max-width: 780px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow:
        0 0 60px rgba(0, 255, 65, 0.06),
        0 0 120px rgba(0, 255, 65, 0.03),
        inset 0 0 60px rgba(0, 255, 65, 0.02);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    overflow: hidden;
    margin: 20px auto;
}

/* ─── OSX BAR ─── */
.term-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    background: rgba(0, 255, 65, 0.02);
}

.term-dot {
    width: 13px; height: 13px;
    border-radius: 50%;
    transition: 0.2s;
}
.term-dot.r { background: #ff5f56; }
.term-dot.y { background: #ffbd2e; }
.term-dot.g { background: #27c93f; }

.term-title {
    margin-left: auto;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 3px;
}

/* ─── TERMINAL BODY ─── */
.term-body {
    padding: 40px 36px 44px;
    max-height: 90vh;
    overflow-y: auto;
}

.term-body::-webkit-scrollbar { width: 4px; }
.term-body::-webkit-scrollbar-track { background: transparent; }
.term-body::-webkit-scrollbar-thumb { background: var(--text-dim); border-radius: 2px; }

@media (max-width: 520px) {
    .term-body { padding: 24px 18px 28px; }
}

/* ─── TITLE SECTION ─── */
.title-section {
    text-align: center;
    margin-bottom: 32px;
    opacity: 0;
    animation: fadeUp 0.8s ease forwards;
}
@keyframes fadeUp {
    to { opacity: 1; transform: translateY(0); }
    from { opacity: 0; transform: translateY(20px); }
}

.title-icon {
    font-size: 42px;
    margin-bottom: 8px;
    display: block;
    filter: drop-shadow(0 0 20px rgba(0, 255, 65, 0.3));
}

.title-main {
    font-family: var(--font-mono);
    font-size: clamp(20px, 5vw, 36px);
    font-weight: 700;
    color: var(--green);
    text-shadow: 0 0 20px rgba(0, 255, 65, 0.4), 0 0 60px rgba(0, 255, 65, 0.15);
    line-height: 1.2;
    letter-spacing: 2px;
    text-transform: uppercase;
}

.title-sub {
    font-family: var(--font-mono);
    font-size: clamp(13px, 2.5vw, 18px);
    color: var(--text-dim);
    margin-top: 6px;
    letter-spacing: 6px;
    text-transform: uppercase;
}

.title-line {
    width: 80px;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--green), transparent);
    margin: 16px auto 0;
    border: none;
    opacity: 0.6;
}

/* ─── TERMINAL LINES ─── */
.term-lines {
    margin-bottom: 8px;
}

.line {
    font-family: var(--font-mono);
    font-size: clamp(13px, 2.5vw, 15px);
    line-height: 1.8;
    color: var(--text);
    opacity: 0;
    transform: translateX(-8px);
}

.line.show {
    animation: slideIn 0.4s ease forwards;
}
@keyframes slideIn {
    to { opacity: 1; transform: translateX(0); }
    from { opacity: 0; transform: translateX(-8px); }
}

.line .prompt {
    color: var(--text-dim);
    margin-right: 8px;
}

.line.highlight {
    color: var(--green);
    text-shadow: 0 0 8px rgba(0, 255, 65, 0.3);
    font-weight: 600;
}

/* ─── TYPEWRITER ─── */
.typewriter {
    display: inline;
}

.typewriter-cursor {
    display: inline-block;
    width: 2px;
    height: 1.1em;
    background: var(--green);
    margin-left: 2px;
    vertical-align: text-bottom;
    animation: cursorBlink 0.7s step-end infinite;
}
@keyframes cursorBlink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
}

.typewriter.done .typewriter-cursor {
    display: none;
}

/* ─── SEPARATOR ─── */
.sep {
    text-align: center;
    margin: 28px 0;
    color: var(--text-dim);
    font-family: var(--font-mono);
    font-size: 13px;
    letter-spacing: 6px;
    opacity: 0.4;
}

/* ─── CAPTCHA ─── */
.captcha-wrap {
    max-width: 380px;
    margin: 0 auto;
    opacity: 0;
    transform: translateY(10px);
    transition: all 0.6s ease;
}
.captcha-wrap.show {
    opacity: 1;
    transform: translateY(0);
}

.captcha-box {
    background: rgba(0, 12, 2, 0.6);
    border: 1px solid rgba(0, 255, 65, 0.15);
    border-radius: 10px;
    padding: 16px 20px;
    transition: all 0.4s ease;
}

.captcha-box.solved {
    border-color: rgba(0, 255, 65, 0.4);
    background: rgba(0, 20, 5, 0.6);
}

.captcha-label {
    display: flex;
    align-items: center;
    gap: 14px;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
}

.captcha-checkbox {
    appearance: none;
    -webkit-appearance: none;
    width: 28px;
    height: 28px;
    border: 2px solid rgba(0, 255, 65, 0.3);
    border-radius: 6px;
    background: transparent;
    cursor: pointer;
    flex-shrink: 0;
    transition: all 0.3s ease;
    position: relative;
}

.captcha-checkbox:hover {
    border-color: rgba(0, 255, 65, 0.6);
    box-shadow: 0 0 12px rgba(0, 255, 65, 0.1);
}

.captcha-checkbox:checked {
    background: var(--green);
    border-color: var(--green);
    box-shadow: 0 0 16px rgba(0, 255, 65, 0.25);
}

.captcha-checkbox:checked::after {
    content: "";
    position: absolute;
    left: 8px;
    top: 3px;
    width: 8px;
    height: 14px;
    border: solid #000;
    border-width: 0 3px 3px 0;
    transform: rotate(45deg);
}

.captcha-text {
    font-family: var(--font-sans);
    font-size: clamp(14px, 2.8vw, 16px);
    color: var(--text);
    font-weight: 400;
}

.captcha-badge {
    margin-left: auto;
    font-family: var(--font-sans);
    font-size: 11px;
    color: var(--text-dim);
    padding: 4px 10px;
    border: 1px solid rgba(0, 255, 65, 0.12);
    border-radius: 4px;
    letter-spacing: 0.5px;
    font-weight: 600;
    opacity: 0.5;
}

/* ─── VERIFY ANIM ─── */
.verify-anim {
    display: none;
    margin-top: 16px;
    padding: 4px 0;
}

.verify-anim.active {
    display: block;
    animation: fadeUp 0.3s ease;
}

.verify-text {
    font-family: var(--font-mono);
    font-size: clamp(11px, 2vw, 13px);
    color: var(--text-dim);
    margin-bottom: 8px;
}

.verify-track {
    height: 3px;
    background: rgba(0, 255, 65, 0.08);
    border-radius: 2px;
    overflow: hidden;
}

.verify-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--green-dim), var(--green));
    border-radius: 2px;
    transition: width 0.1s linear;
}

.verify-fill.done {
    background: #27c93f;
}

/* ─── LOCATION BUTTON ─── */
.btn-section {
    text-align: center;
    margin-top: 24px;
    opacity: 0;
    max-height: 0;
    overflow: hidden;
    transition: all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.btn-section.show {
    opacity: 1;
    max-height: 300px;
    margin-top: 32px;
}

.btn-location {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    padding: 18px 40px;
    background: linear-gradient(135deg, rgba(0, 255, 65, 0.08), rgba(0, 255, 65, 0.02));
    border: 1px solid rgba(0, 255, 65, 0.3);
    border-radius: 12px;
    color: var(--green);
    font-family: var(--font-sans);
    font-size: clamp(15px, 3vw, 18px);
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    letter-spacing: 1.5px;
    transition: all 0.4s ease;
    position: relative;
    overflow: hidden;
    animation: pulseGlow 2.5s ease-in-out infinite;
}

@keyframes pulseGlow {
    0%, 100% { box-shadow: 0 0 20px rgba(0, 255, 65, 0.15), 0 0 40px rgba(0, 255, 65, 0.05); }
    50% { box-shadow: 0 0 40px rgba(0, 255, 65, 0.3), 0 0 80px rgba(0, 255, 65, 0.08); }
}

.btn-location::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(0, 255, 65, 0.06), transparent);
    transition: left 0.6s ease;
}

.btn-location:hover::before {
    left: 100%;
}

.btn-location:hover {
    background: linear-gradient(135deg, rgba(0, 255, 65, 0.14), rgba(0, 255, 65, 0.04));
    border-color: rgba(0, 255, 65, 0.5);
    transform: translateY(-2px) scale(1.02);
    box-shadow: 0 0 50px rgba(0, 255, 65, 0.2);
}

.btn-location .icon {
    font-size: 24px;
    filter: drop-shadow(0 0 8px rgba(0, 255, 65, 0.3));
}

.btn-location .arrow {
    display: inline-block;
    animation: bounceArrow 2s ease-in-out infinite;
}
@keyframes bounceArrow {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(5px); }
}

/* ─── FOOTER ─── */
.term-footer {
    margin-top: 28px;
    padding-top: 16px;
    border-top: 1px solid rgba(0, 255, 65, 0.06);
    font-family: var(--font-mono);
    font-size: 10px;
    color: rgba(0, 255, 65, 0.15);
    text-align: center;
    letter-spacing: 3px;
    text-transform: uppercase;
    opacity: 0;
    transition: opacity 0.8s ease;
}

.term-footer.show {
    opacity: 1;
}

/* ─── GLITCH TEXT (extra effect) ─── */
.glitch-container {
    position: relative;
    display: inline-block;
}

@keyframes glitch {
    0% { clip-path: inset(0 0 80% 0); transform: translate(-1px, 1px); }
    10% { clip-path: inset(20% 0 60% 0); transform: translate(1px, -1px); }
    20% { clip-path: inset(40% 0 40% 0); transform: translate(-1px, 1px); }
    30% { clip-path: inset(60% 0 20% 0); transform: translate(1px, 0); }
    40% { clip-path: inset(80% 0 0 0); transform: translate(-1px, -1px); }
    50%, 100% { clip-path: inset(0 0 0 0); transform: translate(0, 0); }
}

.title-main:hover {
    animation: glitch 0.3s ease 2;
}

/* ─── LOADING DOTS ─── */
.loading-dots::after {
    content: '';
    animation: dots 1.5s steps(4, end) infinite;
}
@keyframes dots {
    0% { content: ''; }
    25% { content: '.'; }
    50% { content: '..'; }
    75% { content: '...'; }
}
</style>
</head>
<body>

<div class="bg-grid"></div>
<canvas id="particles"></canvas>
<div class="crt-glow"></div>
<div class="scanlines"></div>

<div class="terminal">
    <div class="term-bar">
        <span class="term-dot r"></span>
        <span class="term-dot y"></span>
        <span class="term-dot g"></span>
        <span class="term-title">PROTOCOLO EPSILON-9</span>
    </div>

    <div class="term-body" id="termBody">

        <!-- ─── TITLE ─── -->
        <div class="title-section">
            <span class="title-icon">◈</span>
            <h1 class="title-main glitch-container">Cumpleaños de<br>Abdelhakim B.</h1>
            <p class="title-sub">Invitación Especial</p>
            <div class="title-line"></div>
        </div>

        <!-- ─── TERMINAL OUTPUT ─── -->
        <div class="term-lines" id="termLines"></div>

        <div class="sep">✧ ✦ ✧</div>

        <!-- ─── CAPTCHA ─── -->
        <div class="captcha-wrap" id="captchaWrap">
            <div class="captcha-box" id="captchaBox">
                <label class="captcha-label" id="captchaLabel">
                    <input type="checkbox" class="captcha-checkbox" id="captchaCheck">
                    <span class="captcha-text">No soy un robot</span>
                    <span class="captcha-badge">CAPTCHA</span>
                </label>
                <div class="verify-anim" id="verifyAnim">
                    <div class="verify-text" id="verifyText">VERIFICANDO IDENTIDAD<span class="loading-dots"></span></div>
                    <div class="verify-track"><div class="verify-fill" id="verifyFill"></div></div>
                </div>
            </div>
        </div>

        <!-- ─── LOCATION BUTTON ─── -->
        <div class="btn-section" id="btnSection">
            <a class="btn-location" id="btnLocation"
               href="https://www.google.com/maps"
               target="_blank" rel="noopener">
                <span class="icon">📍</span>
                REVELAR UBICACIÓN SECRETA
                <span class="arrow">↓</span>
            </a>
        </div>

        <!-- ─── FOOTER ─── -->
        <div class="term-footer" id="termFooter">
            ◆ ACCESO CONCEDIDO — TRANSMISIÓN SEGURA ◆
        </div>

    </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════
//  CONFIG — EDITAR AQUÍ
// ═══════════════════════════════════════════════════════════════════
const CONFIG = {
    mapsUrl: "https://maps.app.goo.gl/QQpUfsEroN1MzFAn7",
    welcome: "Has sido invitado a un evento que no olvidarás. Verifica tu identidad para acceder a las coordenadas.",
};
// ═══════════════════════════════════════════════════════════════════

// ─── ELEMENTS ───
const $ = id => document.getElementById(id);
const linesEl = $('termLines');
const captchaCheck = $('captchaCheck');
const captchaBox = $('captchaBox');
const captchaWrap = $('captchaWrap');
const verifyAnim = $('verifyAnim');
const verifyText = $('verifyText');
const verifyFill = $('verifyFill');
const btnSection = $('btnSection');
const btnLocation = $('btnLocation');
const termFooter = $('termFooter');

// ─── LINES ───
const LINES = [
    { text: "SISTEMA CIFRADO // PROTOCOLO: INVITACIÓN ESPECIAL", prompt: true },
    { text: "CANAL SEGURO ESTABLECIDO.", prompt: true },
    { text: "" },
    { text: CONFIG.welcome, highlight: true },
    { text: "" },
    { text: "> VERIFICA TU IDENTIDAD PARA ACCEDER A LAS COORDENADAS.", prompt: false },
];

// ─── TYPEWRITER LINES ───
async function showLines() {
    for (const data of LINES) {
        const p = document.createElement('div');
        p.className = 'line';

        if (data.text === '') {
            p.innerHTML = '&nbsp;';
            linesEl.appendChild(p);
            p.classList.add('show');
            await sleep(80);
            continue;
        }

        if (data.prompt) {
            const span = document.createElement('span');
            span.className = 'prompt';
            span.textContent = '$';
            p.appendChild(span);
            p.append(' ' + data.text);
            linesEl.appendChild(p);
            p.classList.add('show');
            await sleep(250);
        } else if (data.highlight) {
            const span = document.createElement('span');
            span.className = 'typewriter';
            p.classList.add('highlight');
            p.appendChild(span);
            linesEl.appendChild(p);
            p.classList.add('show');

            for (let c = 0; c < data.text.length; c++) {
                span.textContent += data.text[c];
                await sleep(22);
            }
            span.classList.add('done');
        } else {
            p.textContent = data.text;
            linesEl.appendChild(p);
            p.classList.add('show');
            await sleep(120);
        }
    }
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// ─── PARTICLES ───
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');
let w, h, particles = [];

function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

class Particle {
    constructor() { this.reset(); }
    reset() {
        this.x = Math.random() * w;
        this.y = Math.random() * h;
        this.vx = (Math.random() - 0.5) * 0.5;
        this.vy = (Math.random() - 0.5) * 0.5;
        this.size = Math.random() * 2 + 0.5;
        this.alpha = Math.random() * 0.4 + 0.1;
    }
    update() {
        this.x += this.vx;
        this.y += this.vy;
        if (this.x < 0 || this.x > w || this.y < 0 || this.y > h) this.reset();
    }
    draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(0, 255, 65, ${this.alpha})`;
        ctx.fill();
    }
}

for (let i = 0; i < 120; i++) particles.push(new Particle());

function animateParticles() {
    ctx.clearRect(0, 0, w, h);
    for (const p of particles) { p.update(); p.draw(); }

    // Draw connections
    for (let i = 0; i < particles.length; i++) {
        for (let j = i + 1; j < particles.length; j++) {
            const dx = particles[i].x - particles[j].x;
            const dy = particles[i].y - particles[j].y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 120) {
                ctx.beginPath();
                ctx.moveTo(particles[i].x, particles[i].y);
                ctx.lineTo(particles[j].x, particles[j].y);
                ctx.strokeStyle = `rgba(0, 255, 65, ${0.06 * (1 - dist / 120)})`;
                ctx.lineWidth = 0.5;
                ctx.stroke();
            }
        }
    }

    requestAnimationFrame(animateParticles);
}
animateParticles();

// ─── CAPTCHA ───
let captchaSolved = false;

captchaCheck.addEventListener('change', async function() {
    if (!this.checked || captchaSolved) return;
    captchaSolved = true;

    captchaBox.classList.add('solved');
    verifyAnim.classList.add('active');

    const steps = 25;
    for (let i = 0; i <= steps; i++) {
        await sleep(55);
        const pct = (i / steps) * 100;
        verifyFill.style.width = pct + '%';

        if (i === 5) verifyText.textContent = 'VERIFICANDO IDENTIDAD...';
        else if (i === 10) verifyText.textContent = 'ESCANEANDO CREDENCIALES...';
        else if (i === 18) verifyText.textContent = 'AUTENTICACIÓN EN PROCESO...';
    }

    verifyText.textContent = '✓ VERIFICACIÓN EXITOSA';
    verifyFill.classList.add('done');
    verifyFill.style.width = '100%';

    await sleep(500);
    verifyAnim.classList.remove('active');

    // Show location button with animation
    btnLocation.href = CONFIG.mapsUrl;
    btnSection.classList.add('show');
    termFooter.classList.add('show');

    // Scroll
    setTimeout(() => {
        btnSection.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 400);
});

// ─── KEYBOARD: Enter to check captcha ───
captchaCheck.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') captchaCheck.checked = !captchaCheck.checked;
});

// ─── START ───
setTimeout(() => {
    captchaWrap.classList.add('show');
}, 600);

showLines();
</script>
</body>
</html>
